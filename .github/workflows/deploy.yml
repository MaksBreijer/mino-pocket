# Zet de site bij elke wijziging op main live als Cloudflare Worker
# (lively-voice-78a8.makscoolbreijer.workers.dev, instellingen in wrangler.jsonc).
# Het account volgt uit het token in het secret CLOUDFLARE_API_TOKEN.
name: Deploy naar Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy met wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Deploy::Het secret CLOUDFLARE_API_TOKEN ontbreekt (Settings → Secrets and variables → Actions → Repository secrets)."
            exit 1
          fi
          set -o pipefail
          if ! npx -y wrangler@4 deploy 2>&1 | tee deploy.log; then
            # Laatste regels als annotatie, zodat de fout ook buiten de log zichtbaar is.
            msg=$(grep -v '^\s*$' deploy.log | tail -n 25 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Wrangler::$msg"
            exit 1
          fi
