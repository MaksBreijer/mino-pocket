# Zet de site bij elke wijziging op main live als Cloudflare Worker
# (lively-voice-78a8.makscoolbreijer.workers.dev, instellingen in wrangler.jsonc).
# Het account volgt uit het token in het secret CLOUDFLARE_API_TOKEN.
name: Deploy naar Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
