# Zet de site bij elke wijziging op main live op Cloudflare Pages
# (account "minorondernemeschap HVA", project minorondernemerschaphva).
name: Deploy naar Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 25edb8c0b391059e9b6a083ce2872127
          workingDirectory: dist
          command: pages deploy . --project-name=minorondernemerschaphva --branch=main --commit-dirty=true
