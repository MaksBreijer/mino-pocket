<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coach · Mino Pocket</title><style>body{margin:0;background:#fff8f4;font:16px Arial;color:#1b1820}.bar{background:#1b1820;color:#fff;padding:18px max(20px,calc((100% - 940px)/2));display:flex;justify-content:space-between}.wrap{max-width:940px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:280px 1fr;gap:18px}.card{background:#fff;border:1px solid #efd9ce;border-radius:15px;padding:18px}.company{display:block;width:100%;text-align:left;padding:12px;border:0;border-bottom:1px solid #efd9ce;background:white;cursor:pointer}.company:hover,.company.active{background:#fff0e8;color:#b9491d}select,textarea,input{width:100%;padding:10px;margin:6px 0 13px;border:1px solid #dcbeb0;border-radius:8px;font:inherit}button{cursor:pointer}.save{background:#ff6b35;color:#fff;border:0;border-radius:8px;padding:11px 14px;font-weight:bold}.hint{color:#6f6560;font-size:.86rem}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><body><header class="bar"><b>Mino Pocket · Coach</b><a href="/login.html" style="color:#fff">Uitloggen</a></header><main class="wrap"><h1>Jouw ondernemingen</h1><p class="hint">Selecteer een cohort en scroll door de ondernemingen die aan jou gekoppeld zijn.</p><div class="grid"><aside class="card"><label>Minor</label><select id="cohort" onchange="showCompanies()"><option value="42">Minor 42</option><option value="43">Minor 43</option></select><div id="companies"></div></aside><section class="card"><h2 id="title">Studio Groei</h2><p id="members" class="hint">Noor Bakker · Lucas Vermeer · Yara Smit</p><label>Assessment</label><select><option>Pitch & Portfolio</option><option>Ondernemingsplan</option></select><label>Teambeoordeling</label><input type="number" min="1" max="10" step="0.1" placeholder="Score 1–10"><label>Feedback voor team</label><textarea placeholder="Concrete feedback voor de onderneming..."></textarea><label>Persoonlijke beoordeling</label><select id="person"></select><textarea placeholder="Persoonlijke feedback..."></textarea><button class="save" onclick="alert('Beoordeling opgeslagen in demo')">Sla beoordeling op</button></section></div></main><script>const data={42:[['Studio Groei','Noor Bakker · Lucas Vermeer · Yara Smit'],['Bloom Labs','Samira El Mansouri · Finn Mulder']],43:[['Next Start','Mila Jansen · Tom Smit'],['Impact Makers','Ravi Patel · Sarah de Jong']]};function showCompanies(){let a=data[cohort.value];companies.innerHTML=a.map((x,i)=>`<button class="company" onclick="pick(${i})">${x[0]}<br><small>${x[1]}</small></button>`).join('');pick(0)}function pick(i){let x=data[cohort.value][i];title.textContent=x[0];members.textContent=x[1];person.innerHTML=x[1].split(' · ').map(p=>`<option>${p}</option>`).join('')}showCompanies()</script></body></html>
