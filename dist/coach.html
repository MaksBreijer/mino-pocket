<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coach · Minor 42</title><style>:root{--o:#ef6d3b;--i:#292632;--l:#f0d9ce}*{box-sizing:border-box}body{margin:0;background:#fff9f6;color:var(--i);font:16px Arial}.bar{padding:18px max(20px,calc((100% - 900px)/2));background:#fff;border-bottom:1px solid var(--l);display:flex;gap:12px;align-items:center}.mark{background:var(--o);color:#fff;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-weight:bold}.wrap{max-width:900px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:20px;margin:16px 0}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button,.save{border:0;border-radius:8px;padding:10px 13px;font-weight:bold;cursor:pointer}.tabs button{background:#fff0e8;color:#b94a20}.tabs button.active,.save{background:var(--o);color:#fff}.hidden{display:none}label{display:block;font-weight:bold;margin:14px 0 6px}select,textarea,input{width:100%;padding:10px;border:1px solid var(--l);border-radius:8px;font:inherit}textarea{min-height:110px}.person{padding:12px;border-top:1px solid var(--l);display:flex;justify-content:space-between;align-items:center}.score{width:92px}.saved{color:#168357;font-weight:bold;display:none}</style><body><header class="bar"><div class="mark">M</div><b>Coachportaal · Minor 42</b></header><main class="wrap"><h1>Beoordelen</h1><p>Kies een teambeoordeling of een persoonlijke assessment.</p><div class="tabs"><button class="active" data-tab="team">Onderneming/team</button><button data-tab="person">Persoonlijk assessment</button></div><section id="team" class="card"><h2>Beoordeling onderneming</h2><label>Onderneming</label><select id="enterprise"><option>Studio Groei</option><option>Bloom Labs</option></select><label>Assessment</label><select id="teamAssessment"><option>Pitch & Portfolio</option><option>Ondernemingsplan</option></select><label>Teamscore (1–10)</label><input id="teamScore" type="number" min="1" max="10" step="0.1" placeholder="Bijv. 7,5"><label>Feedback voor de onderneming</label><textarea id="teamFeedback" placeholder="Wat gaat goed? Wat is de volgende stap?"></textarea><button class="save" onclick="save('team')">Sla teambeoordeling op</button><span class="saved" id="teamSaved">Opgeslagen</span></section><section id="person" class="card hidden"><h2>Persoonlijke beoordeling</h2><label>Onderneming</label><select id="personEnterprise" onchange="setPeople()"><option>Studio Groei</option><option>Bloom Labs</option></select><div id="people"></div><label>Persoon</label><select id="personName"></select><label>Assessment</label><select id="personAssessment"><option>Reflectie</option><option>Pitch & Portfolio</option><option>Professioneel handelen</option></select><label>Persoonlijke score (1–10)</label><input id="personScore" type="number" min="1" max="10" step="0.1" placeholder="Bijv. 8,0"><label>Persoonlijke feedback</label><textarea id="personFeedback" placeholder="Concrete feedback voor deze student..."></textarea><button class="save" onclick="save('person')">Sla persoonlijke beoordeling op</button><span class="saved" id="personSaved">Opgeslagen</span></section></main><script>const people={"Studio Groei":["Noor Bakker","Lucas Vermeer"],"Bloom Labs":["Samira El Mansouri","Finn Mulder"]};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['team','person'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==b.dataset.tab))});function setPeople(){let n=people[personEnterprise.value];personName.innerHTML=n.map(x=>`<option>${x}</option>`).join('');people.innerHTML=n.map(x=>`<div class="person"><span>${x}</span><small>Persoonlijk assessment</small></div>`).join('')}function save(type){let score=document.getElementById(type+'Score').value,feedback=document.getElementById(type+'Feedback').value;if(!score||!feedback){alert('Vul score en feedback in.');return}let key='mino42_'+type+'_'+(type==='team'?enterprise.value:personName.value);localStorage.setItem(key,JSON.stringify({score,feedback,at:new Date().toLocaleString('nl-NL')}));document.getElementById(type+'Saved').style.display='inline';setTimeout(()=>document.getElementById(type+'Saved').style.display='none',2500)}setPeople();</script></body></html>
