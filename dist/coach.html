<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coach · Mino Pocket</title><style>:root{--o:#ff6b35;--i:#1b1820;--l:#efd9ce}*{box-sizing:border-box}body{margin:0;background:#fff8f4;font:16px Arial;color:var(--i)}.bar{background:var(--i);color:#fff;padding:18px max(20px,calc((100% - 940px)/2));display:flex;justify-content:space-between;align-items:center}.bar small{font-weight:normal;color:#cdc7c5}.wrap{max-width:940px;margin:auto;padding:28px}.eyebrow,.hint{color:#6f6560;font-size:.86rem}.eyebrow{font-weight:bold;letter-spacing:.1em}.grid{display:grid;grid-template-columns:280px 1fr;gap:18px}.card{background:#fff;border:1px solid var(--l);border-radius:15px;padding:18px}.company{display:block;width:100%;text-align:left;padding:12px;border:0;border-bottom:1px solid var(--l);background:white;cursor:pointer}.company.active{background:#fff0e8;color:#b9491d}.company:hover{background:#fff6f1}select,textarea,input{width:100%;padding:10px;margin:6px 0 13px;border:1px solid #dcbeb0;border-radius:8px;font:inherit}.save{background:var(--o);color:#fff;border:0;border-radius:8px;padding:11px 14px;font-weight:bold;cursor:pointer}.logout{color:#fff}.empty{padding:16px;background:#fff0e8;border-radius:10px;color:#6f5145}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:18px}}</style><body><header class="bar"><b>Mino Pocket · Coach <small id="email"></small></b><a class="logout" href="/login.html" onclick="logout()">Uitloggen</a></header><main class="wrap"><p class="eyebrow" id="period">COACHPORTAAL</p><h1>Mijn toegewezen ondernemingen</h1><p class="hint">Deze lijst wordt per halfjaar door de admin samengesteld. Je ziet alleen de ondernemingen die aan jou gekoppeld zijn.</p><div class="grid"><aside class="card"><h2>Mijn teams</h2><div id="companies"></div></aside><section class="card" id="assessment"><h2 id="title">Kies een onderneming</h2><p id="members" class="hint">Selecteer links een toegewezen onderneming.</p><div id="form" hidden><label>Assessment</label><select><option>Pitch & Portfolio</option><option>Ondernemingsplan</option></select><label>Teambeoordeling</label><input type="number" min="1" max="10" step="0.1" placeholder="Score 1–10"><label>Feedback voor team</label><textarea placeholder="Concrete feedback voor de onderneming..."></textarea><label>Persoonlijke beoordeling</label><select id="person"></select><textarea placeholder="Persoonlijke feedback..."></textarea><button class="save" onclick="alert('Beoordeling opgeslagen in demo')">Sla beoordeling op</button></div></section></div></main><script>const user=JSON.parse(sessionStorage.getItem('mino-user')||'null');if(!user||user.role!=='coach')location.replace('/login.html');else email.textContent='· '+user.email;function logout(){sessionStorage.removeItem('mino-user')}const fallback=[{period:'Minor 42 · halfjaar 1',company:'Studio Groei',members:'Noor Bakker · Lucas Vermeer · Yara Smit',coach:'coach@minor.nl'}];const all=JSON.parse(localStorage.getItem('mino-assignments')||'null')||fallback;const mine=all.filter(x=>x.coach===user.email||x.coach==='coach@minor.nl');period.textContent=mine[0]?.period||'COACHPORTAAL';companies.innerHTML=mine.length?mine.map((x,i)=>`<button class="company" onclick="pick(${i})">${x.company}<br><small>${x.period}</small></button>`).join(''):'<p class="empty">Nog geen ondernemingen toegewezen. Neem contact op met de admin.</p>';function pick(i){let x=mine[i];title.textContent=x.company;members.textContent=x.members;person.innerHTML=x.members.split(' · ').map(p=>`<option>${p}</option>`).join('');form.hidden=false;document.querySelectorAll('.company').forEach((b,n)=>b.classList.toggle('active',n===i))}if(mine.length)pick(0)</script></body></html>
