<!doctype html>
<html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inloggen · Minor Pocket</title>
<style>
:root{--orange:#ff6b35;--ink:#191720;--line:#ecdcd4;--soft:#fff6f2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#18161e 55%,var(--orange) 55%);font:16px Arial;color:var(--ink)}main{width:min(92vw,500px);padding:32px;background:#fff;border-radius:24px;box-shadow:15px 15px #0003}.mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--orange);color:#fff;font:bold 1.4rem Arial}.eyebrow{margin:16px 0 4px;color:#766e69;font-size:.75rem;font-weight:bold;letter-spacing:.11em}h1{margin:0;font-size:2rem}.intro{color:#665f5b}.field-label{display:block;font-weight:bold;margin:18px 0 8px}input{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px;font:inherit}.button{width:100%;margin-top:20px;background:var(--orange);color:#fff;border:0;border-radius:12px;padding:14px;font:bold 1rem Arial;cursor:pointer}.button:disabled{opacity:.6}.switch{background:none;border:0;color:#b9491d;font:inherit;text-decoration:underline;cursor:pointer;padding:0}.error{background:#fff0e8;color:#8a2f0c;border-radius:10px;padding:12px;margin-top:16px}.note{font-size:.8rem;color:#766e69;margin:20px 0 0}@media(max-width:560px){body{background:var(--ink)}main{min-height:100vh;width:100%;border-radius:0;padding:28px 22px}}
</style>
<body><main><div class="mark">M</div><p class="eyebrow">MINOR ONDERNEMERSCHAP</p><h1 id="title">Jouw Minor Pocket.</h1><p class="intro" id="intro">Log in voor je student- of coachomgeving.</p>
<form id="form"><label class="field-label" for="mail">E-mailadres</label><input id="mail" type="email" autocomplete="email" placeholder="naam@hva.nl" required>
<label class="field-label" for="password">Wachtwoord</label><input id="password" type="password" autocomplete="current-password" minlength="8" required>
<button class="button" id="submit">Inloggen</button></form>
<p id="error" class="error" hidden></p>
<p class="note"><span id="switchText">Nog geen account?</span> <button class="switch" id="switch" type="button">Account aanmaken</button><br>Je kunt alleen een account aanmaken als de admin je e-mailadres heeft toegevoegd.</p></main>
<script type="module">
import { supabase, currentProfile, message } from './js/supabase.js';
const homes = { student: '/', coach: '/coach.html' };
let signup = false;

async function route() {
  const profile = await currentProfile();
  if (!profile) return;
  if (profile.role === 'admin') {
    await supabase.auth.signOut();
    return show('Admins loggen in via de admin-tablet.');
  }
  location.replace(homes[profile.role]);
}

function show(text) { error.hidden = !text; error.textContent = text || ''; }

document.querySelector('#switch').onclick = () => {
  signup = !signup;
  title.textContent = signup ? 'Account aanmaken.' : 'Jouw Minor Pocket.';
  intro.textContent = signup ? 'Kies een wachtwoord van minimaal 8 tekens.' : 'Log in voor je student- of coachomgeving.';
  submit.textContent = signup ? 'Account aanmaken' : 'Inloggen';
  switchText.textContent = signup ? 'Heb je al een account?' : 'Nog geen account?';
  document.querySelector('#switch').textContent = signup ? 'Inloggen' : 'Account aanmaken';
  password.autocomplete = signup ? 'new-password' : 'current-password';
  show('');
};

form.onsubmit = async (e) => {
  e.preventDefault();
  submit.disabled = true; show('');
  const credentials = { email: mail.value.trim().toLowerCase(), password: password.value };
  const { data, error: err } = signup
    ? await supabase.auth.signUp(credentials)
    : await supabase.auth.signInWithPassword(credentials);
  submit.disabled = false;
  if (err) return show(message(err));
  if (!data.session) return show('Bijna klaar: bevestig je account via de e-mail die je net hebt gekregen.');
  route();
};

route();
</script></body></html>
