<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inloggen · Mino Pocket</title><style>:root{--o:#ff6b35;--i:#191720;--l:#ecdcd4}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#18161e 55%,#ff6b35 55%);font:16px Arial}.box{width:min(92vw,460px);padding:30px;background:#fff;border-radius:22px;box-shadow:15px 15px #0003}.mark{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--o);color:#fff;font-weight:bold;font-size:1.3rem}.minor{color:#766e69;font-size:.75rem;font-weight:bold;letter-spacing:.1em}.role{width:100%;text-align:left;background:#fff;border:1px solid var(--l);border-radius:11px;padding:14px;margin:8px 0;font-weight:bold;cursor:pointer}.role:hover{border-color:var(--o);background:#fff6f2}.role small{display:block;color:#766e69;margin-top:3px;font-weight:normal}label{display:block;font-weight:bold;margin:20px 0 7px}input{width:100%;border:1px solid var(--l);border-radius:9px;padding:12px;font:inherit}.note{font-size:.8rem;color:#766e69;margin-top:18px}</style><body><main class="box"><div class="mark">M</div><p class="minor">MINOR 42 · ONDERNEMERSCHAP</p><h1>Welkom terug.</h1><p>Kies jouw omgeving om verder te gaan.</p><label for="mail">E-mailadres</label><input id="mail" type="email" placeholder="naam@student.nl"><button class="role" onclick="go('/')">Student <small>Mijn onderneming, deadlines en feedback</small></button><button class="role" onclick="go('/coach.html')">Coach <small>Ondernemingen en beoordelingen</small></button><button class="role" onclick="go('/admin.html')">Admin <small>Cohorten, koppelingen en roosterbeheer</small></button><p class="note">Demo-login: de e-mail wordt na database-koppeling gebruikt om automatisch de juiste rol te bepalen.</p></main><script>function go(path){let m=document.getElementById('mail');if(!m.value){m.focus();m.setAttribute('aria-invalid','true');return}location.href=path}</script></body></html>
