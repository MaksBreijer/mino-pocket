<!doctype html>
<html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inloggen · Mino Pocket</title>
<style>
:root{--orange:#ff6b35;--ink:#191720;--line:#ecdcd4;--soft:#fff6f2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#18161e 55%,var(--orange) 55%);font:16px Arial;color:var(--ink)}main{width:min(92vw,500px);padding:32px;background:#fff;border-radius:24px;box-shadow:15px 15px #0003}.mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--orange);color:#fff;font:bold 1.4rem Arial}.eyebrow{margin:16px 0 4px;color:#766e69;font-size:.75rem;font-weight:bold;letter-spacing:.11em}h1{margin:0;font-size:2rem}.intro{color:#665f5b}.field-label{display:block;font-weight:bold;margin:22px 0 8px}input{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px;font:inherit}.roles{display:grid;gap:9px;margin-top:17px}.role{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;cursor:pointer;font:inherit}.role:hover,.role:focus{border-color:var(--orange);background:var(--soft);outline:none}.role b,.role small{display:block}.role small{margin-top:3px;color:#766e69}.badge{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--ink);color:white;font-weight:bold}.note{font-size:.8rem;color:#766e69;margin:20px 0 0}@media(max-width:560px){body{background:var(--ink)}main{min-height:100vh;width:100%;border-radius:0;padding:28px 22px}}
</style>
<body><main><div class="mark">M</div><p class="eyebrow">MINOR 42 · ONDERNEMERSCHAP</p><h1>Jouw Mino Pocket.</h1><p class="intro">Log in en ga direct naar jouw eigen omgeving.</p><label class="field-label" for="mail">E-mailadres</label><input id="mail" type="email" autocomplete="email" placeholder="naam@student.nl" required>
<div class="roles" aria-label="Kies jouw rol"><button class="role" onclick="login('student','/')"><span class="badge">S</span><span><b>Inloggen als student</b><small>Onderneming, rooster, inleveringen en feedback</small></span></button><button class="role" onclick="login('coach','/coach.html')"><span class="badge">C</span><span><b>Inloggen als coach</b><small>Jouw ondernemingen en beoordelingen</small></span></button><button class="role" onclick="login('admin','/admin.html')"><span class="badge">A</span><span><b>Inloggen als admin</b><small>Cohorten, koppelingen en roosterbeheer</small></span></button></div><p class="note">Prototype-login: later controleert Supabase automatisch e-mail, rol en toegang.</p></main><script>function login(role,path){const email=document.querySelector('#mail');if(!email.value||!email.validity.valid){email.focus();email.setAttribute('aria-invalid','true');return}sessionStorage.setItem('mino-user',JSON.stringify({role,email:email.value}));location.href=path}</script></body></html>
